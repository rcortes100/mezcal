title: Contact
icon: fa-envelope
order: 4

<p>Would you like to contact me for any comment or question about my work, my interests,
a blog entrance, or just a friendly chat? Please fill the following form and I will
get in touch with you as soon as possible.</p>

<form method="post" action="https://formspree.io/{{ site.formspree_endpoint }}">
  <div class="row">
    <div class="6u 12u$(mobile)"><input type="text" name="name" placeholder="Name" /></div>
    <div class="6u$ 12u$(mobile)"><input type="text" name="email" placeholder="Email" /></div>
    <div class="12u$">
      <textarea name="message" placeholder="Message"></textarea>
    </div>
    <div class="12u$">
      <input type="submit" value="Send Message" />
    </div>
  </div>
</form>
